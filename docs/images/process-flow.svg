<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475e75"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="300" rx="12" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2d3e">Purchase request lifecycle</text>

  <!-- Start -->
  <circle cx="40" cy="130" r="9" fill="#1d2d3e"/>

  <!-- New -->
  <rect x="100" y="105" width="140" height="50" rx="10" fill="#eef1f4" stroke="#6a6d70" stroke-width="2"/>
  <text x="170" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#32363a">New</text>

  <!-- Submitted -->
  <rect x="330" y="105" width="140" height="50" rx="10" fill="#fff3e0" stroke="#e9730c" stroke-width="2"/>
  <text x="400" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#8f4c00">Submitted</text>

  <!-- Approved -->
  <rect x="590" y="105" width="140" height="50" rx="10" fill="#eaf6ec" stroke="#2b7d2b" stroke-width="2"/>
  <text x="660" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e5a1e">Approved</text>

  <!-- SAP purchase requisition -->
  <rect x="830" y="98" width="150" height="64" rx="10" fill="#e8f1fb" stroke="#0a6ed1" stroke-width="2"/>
  <text x="905" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#0a4a8c">SAP purchase</text>
  <text x="905" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#0a4a8c">requisition (MM)</text>

  <!-- Rejected -->
  <rect x="590" y="215" width="140" height="50" rx="10" fill="#fdecea" stroke="#bb0000" stroke-width="2"/>
  <text x="660" y="246" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a0000">Rejected</text>

  <!-- Arrows -->
  <line x1="50" y1="130" x2="98" y2="130" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="74" y="96" text-anchor="middle" font-size="12" fill="#475e75">Create</text>
  <text x="74" y="111" text-anchor="middle" font-size="11" fill="#6a6d70">(draft)</text>

  <line x1="240" y1="130" x2="328" y2="130" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="285" y="112" text-anchor="middle" font-size="13" fill="#475e75">Submit</text>
  <text x="285" y="152" text-anchor="middle" font-size="11" fill="#6a6d70">requester</text>

  <line x1="470" y1="130" x2="588" y2="130" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="529" y="112" text-anchor="middle" font-size="13" fill="#475e75">Approve</text>
  <text x="529" y="152" text-anchor="middle" font-size="11" fill="#6a6d70">approver</text>

  <line x1="730" y1="130" x2="828" y2="130" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="779" y="112" text-anchor="middle" font-size="11" fill="#475e75">BAPI_PR_CREATE</text>
  <text x="779" y="152" text-anchor="middle" font-size="11" fill="#6a6d70">on save</text>

  <polyline points="400,155 400,240 588,240" fill="none" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="495" y="231" text-anchor="middle" font-size="13" fill="#475e75">Reject (reason)</text>
  <text x="495" y="258" text-anchor="middle" font-size="11" fill="#6a6d70">approver</text>
</svg>
