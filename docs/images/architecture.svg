<svg xmlns="http://www.w3.org/2000/svg" width="900" height="770" viewBox="0 0 900 770" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475e75"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="770" rx="12" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1d2d3e">Architecture</text>

  <!-- 1. UI -->
  <rect x="200" y="45" width="500" height="60" rx="10" fill="#e8f1fb" stroke="#0a6ed1" stroke-width="2"/>
  <text x="450" y="71" text-anchor="middle" font-size="15" font-weight="bold" fill="#0a4a8c">SAP Fiori Elements</text>
  <text x="450" y="91" text-anchor="middle" font-size="12" fill="#0a4a8c">List Report &amp; Object Page</text>

  <line x1="450" y1="105" x2="450" y2="143" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="129" font-size="12" fill="#475e75">OData V4</text>

  <!-- 2. Service -->
  <rect x="200" y="145" width="500" height="60" rx="10" fill="#f1ecfb" stroke="#7858ff" stroke-width="2"/>
  <text x="450" y="171" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b2fa8">Business service</text>
  <text x="450" y="191" text-anchor="middle" font-size="12" fill="#4b2fa8">Binding ZUI_PR11_PURCHREQ_O4 · Definition ZUI_PR11_PURCHREQ</text>

  <line x1="450" y1="205" x2="450" y2="233" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Projection -->
  <rect x="200" y="235" width="500" height="70" rx="10" fill="#e6f5f5" stroke="#0f828f" stroke-width="2"/>
  <text x="450" y="261" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b5c65">Projection layer</text>
  <text x="450" y="280" text-anchor="middle" font-size="12" fill="#0b5c65">ZC_PR11_PurchReq / ZC_PR11_PurchReqItem</text>
  <text x="450" y="296" text-anchor="middle" font-size="12" fill="#0b5c65">metadata extensions · projection BDEF · access controls</text>

  <line x1="450" y1="305" x2="450" y2="333" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. BO interface -->
  <rect x="200" y="335" width="500" height="80" rx="10" fill="#e6f5f5" stroke="#0f828f" stroke-width="2"/>
  <text x="450" y="361" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b5c65">Business object (interface layer)</text>
  <text x="450" y="381" text-anchor="middle" font-size="12" fill="#0b5c65">ZI_PR11_PurchReq / ZI_PR11_PurchReqItem</text>
  <text x="450" y="398" text-anchor="middle" font-size="12" fill="#0b5c65">BDEF: managed · draft · additional save · access controls</text>

  <!-- Branches -->
  <polyline points="300,415 300,440 150,440 150,463" fill="none" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="415" x2="450" y2="463" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="600,415 600,440 750,440 750,463" fill="none" stroke="#475e75" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>

  <!-- 5a. Database -->
  <rect x="30" y="465" width="240" height="70" rx="10" fill="#eef1f4" stroke="#6a6d70" stroke-width="2"/>
  <text x="150" y="491" text-anchor="middle" font-size="15" font-weight="bold" fill="#32363a">Database tables</text>
  <text x="150" y="510" text-anchor="middle" font-size="12" fill="#32363a">ZPR11_HDR / ZPR11_ITM</text>
  <text x="150" y="526" text-anchor="middle" font-size="12" fill="#32363a">+ draft tables</text>

  <!-- 5b. Behavior pool -->
  <rect x="330" y="465" width="240" height="70" rx="10" fill="#fff3e0" stroke="#e9730c" stroke-width="2"/>
  <text x="450" y="491" text-anchor="middle" font-size="15" font-weight="bold" fill="#8f4c00">Behavior pool</text>
  <text x="450" y="510" text-anchor="middle" font-size="12" fill="#8f4c00">ZBP_I_PR11_PURCHREQ</text>
  <text x="450" y="526" text-anchor="middle" font-size="12" fill="#8f4c00">handlers · saver · unit tests</text>

  <!-- 5c. Master data -->
  <rect x="630" y="465" width="240" height="70" rx="10" fill="#eef1f4" stroke="#6a6d70" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="750" y="491" text-anchor="middle" font-size="15" font-weight="bold" fill="#32363a">Master data</text>
  <text x="750" y="510" text-anchor="middle" font-size="12" fill="#32363a">I_Plant · I_PurchasingGroup</text>
  <text x="750" y="526" text-anchor="middle" font-size="12" fill="#32363a">MARA / MAKT (value help)</text>

  <line x1="450" y1="535" x2="450" y2="583" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="564" font-size="12" fill="#475e75">additional save (save_modified)</text>

  <!-- 6. BAPI -->
  <rect x="330" y="585" width="240" height="50" rx="10" fill="#fff3e0" stroke="#e9730c" stroke-width="2"/>
  <text x="450" y="616" text-anchor="middle" font-size="15" font-weight="bold" fill="#8f4c00">BAPI_PR_CREATE</text>

  <line x1="450" y1="635" x2="450" y2="673" stroke="#475e75" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. MM -->
  <rect x="300" y="675" width="300" height="65" rx="10" fill="#eaf6ec" stroke="#2b7d2b" stroke-width="2"/>
  <text x="450" y="701" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e5a1e">SAP S/4HANA MM</text>
  <text x="450" y="722" text-anchor="middle" font-size="12" fill="#1e5a1e">Standard purchase requisition (type NB)</text>
</svg>
